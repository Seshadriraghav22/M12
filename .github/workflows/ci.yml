name: Java CI with Tests & Code Quality

on:
  push:
    branches: [ war ]
  pull_request:
    branches: [ war ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Run Unit Tests
        run: mvn clean test

      - name: Run PMD
        run: mvn pmd:check

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Run SpotBugs
        run: mvn spotbugs:check

      - name: Package WAR file
        run: mvn package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: target/*.war

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-artifact
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/docker-war-demo:latest
            ${{ secrets.DOCKER_USERNAME }}/docker-war-demo:${{ github.run_id }}

  updatek8s:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update tag in Kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/docker-war-demo:${{ github.run_id }}|" deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "seshadriraghav24@gmail.com"
          git config --global user.name "Seshadri Raghav"
          git add deploy.yaml
          git commit -m "[CI]: Update Docker image tag to ${{ github.run_id }}"
          git push origin HEAD:war -f
